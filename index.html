<title>SkorUASA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="SkorUASA.com — 3 set soalan ramalan UASA Tahun 5 bagi Bahasa Melayu, Bahasa Inggeris, Matematik dan Sains, ikut format rasmi KPM dengan skema jawapan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,500;0,700;0,800;0,900;1,500&family=Kalam:wght@700&display=swap">
<style>
/* Layout: meja murid — latar buku latihan bertitik, kad "pelekat" bergaris tebal dengan bayang berwarna,
   setiap subjek ada warna krayon sendiri; kertas soalan kekal putih & mudah dibaca, skema dalam dakwat merah guru */
:root{
 --desk:#e9f5ff; --dot:#c7e0fa; --paper:#ffffff; --ink:#1d2b4f; --ink2:#55648a; --line:#1d2b4f; --rule:#dbe4f2; --soft:#f4f8fe;
 --sun:#ffd23f; --sun-t:#fff6cf; --ok:#14994a; --ok-t:#dcf7e6; --red:#e23b3b; --red-t:#ffe7e5;
 --bm:#0f9950; --bm-t:#ddf7e8; --bi:#e8650a; --bi-t:#ffeedd; --mt:#2f6bff; --mt-t:#e3ecff; --sn:#9b51e0; --sn-t:#f2e7fd;
 --on:#ffffff;
 --f-disp:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
 --f-body:"Nunito", "Segoe UI", Arial, sans-serif;
 --f-pen:"Kalam", "Comic Sans MS", cursive;
 --r:18px; --sh:4px 4px 0 var(--line);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
 --desk:#0f1733; --dot:#1d2a52; --paper:#17213f; --ink:#eef3ff; --ink2:#a9b7da; --line:#5468a6; --rule:#2a3762; --soft:#1e2a4d;
 --sun:#ffd23f; --sun-t:#3d3412; --ok:#4ade80; --ok-t:#123726; --red:#ff6b6b; --red-t:#3f1d24;
 --bm:#3ddc84; --bm-t:#143a29; --bi:#ff9a4d; --bi-t:#40281a; --mt:#6f97ff; --mt-t:#1c2c5c; --sn:#bb8cff; --sn-t:#2f2152;
 --on:#0f1733; color-scheme:dark }}
:root[data-theme="dark"]{
 --desk:#0f1733; --dot:#1d2a52; --paper:#17213f; --ink:#eef3ff; --ink2:#a9b7da; --line:#5468a6; --rule:#2a3762; --soft:#1e2a4d;
 --sun:#ffd23f; --sun-t:#3d3412; --ok:#4ade80; --ok-t:#123726; --red:#ff6b6b; --red-t:#3f1d24;
 --bm:#3ddc84; --bm-t:#143a29; --bi:#ff9a4d; --bi-t:#40281a; --mt:#6f97ff; --mt-t:#1c2c5c; --sn:#bb8cff; --sn-t:#2f2152;
 --on:#0f1733; color-scheme:dark }
*{box-sizing:border-box}
body{background-color:var(--desk); background-image:radial-gradient(var(--dot) 1.4px, transparent 1.6px); background-size:22px 22px;
 color:var(--ink); font-family:var(--f-body); font-size:16.5px; line-height:1.6; margin:0; font-weight:500}
button{font:inherit; color:inherit}
a{color:var(--mt)}
b, strong{font-weight:800}
:focus-visible{outline:3px solid var(--sun); outline-offset:3px}
.wrap{max-width:880px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* Bar atas */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--paper); border-bottom:3px solid var(--line)}
.top .wrap{display:flex; align-items:center; gap:10px; padding-block:8px; flex-wrap:wrap}
.brand{font-family:var(--f-disp); font-weight:800; font-size:1.55rem; line-height:1; text-decoration:none; color:var(--ink); display:flex; align-items:baseline}
.brand .u{display:inline-block} .brand .u1{color:var(--bm); transform:rotate(-6deg)} .brand .u2{color:var(--bi); transform:translateY(-2px) rotate(4deg)} .brand .u3{color:var(--mt); transform:rotate(-3deg)} .brand .u4{color:var(--sn); transform:translateY(-1px) rotate(6deg)}
.brand small{font-size:.75rem; color:var(--ink2); font-weight:700; margin-left:3px}
.nav{margin-left:auto; display:flex; gap:6px}
.nav a{padding:6px 14px; border-radius:999px; text-decoration:none; color:var(--ink); font-weight:800; font-size:.92rem; border:2px solid transparent}
.nav a[aria-current="page"]{background:var(--sun); border-color:var(--line); color:#1d2b4f}
.pill-top{font-family:var(--f-disp); font-weight:700; font-size:.95rem; padding:4px 12px; border-radius:999px; background:var(--soft); border:2px solid var(--line); font-variant-numeric:tabular-nums; cursor:pointer; white-space:nowrap}
.pill-top.low{background:var(--red-t); color:var(--red); border-color:var(--red)}
.progbar{height:6px; background:var(--soft); position:relative}
.progbar i{position:absolute; inset:0 auto 0 0; background:var(--c, var(--mt)); width:0; transition:width .3s}

/* Laman utama */
.hero{padding-block:30px 6px; display:grid; grid-template-columns:1fr auto; gap:16px; align-items:center}
.hero h1{font-family:var(--f-disp); font-weight:800; font-size:clamp(2rem, 6vw, 3.1rem); line-height:1.02; margin:0 0 10px; text-wrap:balance}
.hero h1 mark{background:var(--sun); color:#1d2b4f; padding:0 .2em; border-radius:10px; box-decoration-break:clone; -webkit-box-decoration-break:clone}
.hero p{margin:0; color:var(--ink2); max-width:58ch; font-size:1.02rem}
.hero-art{width:150px; max-width:100%}
@media (max-width:600px){ .hero{grid-template-columns:1fr} .hero-art{display:none} }
.facts{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px}
.facts span{font-weight:800; font-size:.85rem; padding:5px 12px; border-radius:999px; background:var(--paper); border:2px solid var(--line)}
.facts span:nth-child(1){background:var(--bm-t)} .facts span:nth-child(2){background:var(--bi-t)} .facts span:nth-child(3){background:var(--mt-t)} .facts span:nth-child(4){background:var(--sn-t)}
.grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap:22px; padding-block:24px 8px}
.mp{background:var(--paper); border:3px solid var(--line); border-radius:var(--r); box-shadow:6px 6px 0 var(--c); overflow:hidden; display:flex; flex-direction:column; min-width:0}
.mp-h{background:var(--c); color:var(--on); display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:3px solid var(--line)}
.ico{flex:none; width:52px; height:52px; border-radius:16px; background:var(--paper); border:3px solid var(--line); display:grid; place-items:center; color:var(--c)}
.ico svg{width:30px; height:30px}
.mp h2{font-family:var(--f-disp); font-weight:800; font-size:1.45rem; margin:0; line-height:1.1}
.mp-h small{display:block; font-weight:800; font-size:.8rem; opacity:.9}
.mp-b{padding:16px; display:flex; flex-direction:column; gap:12px; background:var(--t)}
.mp .fmt{font-size:.88rem; color:var(--ink2); margin:0; font-weight:700}
.sets{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px}
.set-btn{display:flex; flex-direction:column; align-items:center; gap:2px; padding:12px 6px 10px; border-radius:14px; border:3px solid var(--line); background:var(--paper); text-decoration:none; color:var(--ink); box-shadow:3px 3px 0 var(--line); transition:transform .12s, box-shadow .12s; min-width:0}
.set-btn:hover{transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--line)}
.set-btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--line)}
.set-btn b{font-family:var(--f-disp); font-size:1.25rem; line-height:1.1}
.set-btn .st{font-size:.95rem; letter-spacing:1px; line-height:1; color:var(--rule)}
.set-btn .st .on{color:#f5b300}
.set-btn span.sc{font-size:.76rem; color:var(--ink2); font-weight:800; text-align:center}
.set-btn.done span.sc{color:var(--c)}
.note{font-size:.9rem; color:var(--ink); background:var(--sun-t); border:2px dashed var(--line); border-radius:14px; padding:12px 16px; margin-block:16px 36px; max-width:74ch}

/* Kertas soalan */
.paper{background:var(--paper); border:3px solid var(--line); border-radius:var(--r); margin-block:20px 40px; padding:clamp(18px, 4vw, 40px); box-shadow:8px 8px 0 var(--c, var(--line))}
.cover{border-radius:14px; background:var(--c); color:var(--on); border:3px solid var(--line); padding:16px 18px; display:grid; grid-template-columns:auto 1fr auto; gap:6px 16px; align-items:center}
.cover .ico{width:58px; height:58px}
.cover .lbl{font-weight:800; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; opacity:.9}
.cover h1{font-family:var(--f-disp); font-weight:800; font-size:clamp(1.6rem,4.5vw,2.2rem); margin:0; line-height:1.05; text-wrap:balance}
.cover .meta{text-align:right; font-weight:800}
.cover .meta .setno{display:inline-block; font-family:var(--f-disp); font-size:1.3rem; background:var(--sun); color:#1d2b4f; border:3px solid var(--line); border-radius:12px; padding:0 12px; transform:rotate(3deg)}
.cover .bar{grid-column:1/-1; display:flex; gap:8px; flex-wrap:wrap; margin-top:6px}
.cover .bar span{background:var(--paper); color:var(--ink); border-radius:999px; padding:3px 12px; font-size:.84rem; font-weight:800; border:2px solid var(--line)}
@media (max-width:520px){ .cover{grid-template-columns:auto 1fr} .cover .meta{grid-column:1/-1; text-align:left} }
.tools{display:flex; gap:8px; flex-wrap:wrap; margin-block:16px 6px}
.btn{border:2.5px solid var(--line); background:var(--paper); padding:8px 16px; border-radius:999px; font-weight:800; cursor:pointer; font-size:.92rem; text-decoration:none; color:var(--ink); box-shadow:2px 2px 0 var(--line); transition:transform .1s, box-shadow .1s; display:inline-flex; align-items:center; gap:6px}
.btn:hover{transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--line)}
.btn:active{transform:translate(1px,1px); box-shadow:0 0 0 var(--line)}
.btn.pri{background:var(--c, var(--mt)); color:var(--on); font-family:var(--f-disp); font-size:1.15rem; padding:10px 24px}
.btn.red{color:var(--red); border-color:var(--red); box-shadow:2px 2px 0 var(--red)}
.sec{margin-top:34px}
.sec-h{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.sec-h h2{font-family:var(--f-disp); font-weight:800; font-size:1.3rem; margin:0; background:var(--t); border:3px solid var(--line); border-radius:12px; padding:2px 14px; transform:rotate(-1.5deg)}
.sec-h .m{font-weight:800; font-size:.9rem; margin-left:auto; color:var(--ink2)}
.sec-a{color:var(--ink2); margin:10px 0 4px; font-size:.97rem; font-weight:700}
.q{display:grid; grid-template-columns:2.8em 1fr; gap:0 12px; padding-block:16px; border-bottom:2px dashed var(--rule)}
.q:last-child{border-bottom:0}
.qn{font-family:var(--f-disp); font-weight:800; font-size:1rem; width:2.4em; height:2.4em; border-radius:50%; background:var(--t); border:2.5px solid var(--line); display:grid; place-items:center; line-height:1}
.qn.long{border-radius:10px; width:auto; min-width:2.4em; height:auto; padding:4px 4px; font-size:.8rem}
.q.answered .qn{background:var(--c); color:var(--on)}
.qb{min-width:0}
.qs{margin:2px 0 10px; font-size:1.02rem}
.qm{font-weight:800; font-size:.78rem; color:var(--ink2); white-space:nowrap; float:right; margin-left:10px; background:var(--soft); border-radius:999px; padding:1px 9px}
.opts{display:grid; gap:8px}
.opts.c2{grid-template-columns:repeat(auto-fill, minmax(min(100%, 160px), 1fr))}
.opts.c8{grid-template-columns:repeat(8, minmax(0,1fr))}
@media (max-width:520px){ .opts.c8{grid-template-columns:repeat(4, minmax(0,1fr))} }
.opt{display:flex; align-items:center; gap:10px; text-align:left; padding:9px 12px; border:2.5px solid var(--rule); border-radius:14px; background:var(--paper); cursor:pointer; min-width:0; font-weight:700; transition:border-color .12s, background .12s, transform .1s}
.opt:hover{border-color:var(--c); background:var(--t)}
.opt:active{transform:scale(.98)}
.opt .bub{flex:none; width:2em; height:2em; border-radius:50%; border:2.5px solid var(--line); display:grid; place-items:center; font-family:var(--f-disp); font-weight:800; font-size:.9rem; background:var(--paper)}
.opt[aria-pressed="true"]{border-color:var(--line); background:var(--t); box-shadow:3px 3px 0 var(--c)}
.opt[aria-pressed="true"] .bub{background:var(--c); color:var(--on)}
.opt.ok{border-color:var(--ok); background:var(--ok-t); box-shadow:none}
.opt.ok .bub{background:var(--ok); color:var(--on); border-color:var(--ok)}
.opt.no{border-color:var(--red); background:var(--red-t); box-shadow:none}
.opt.no .bub{background:var(--red); color:var(--on); border-color:var(--red)}
.inp{width:100%; padding:10px 14px; border:2.5px solid var(--rule); border-radius:14px; background:var(--soft); color:var(--ink); font:inherit; font-weight:700}
.inp:focus{border-color:var(--c, var(--mt)); outline:none; box-shadow:3px 3px 0 var(--c, var(--mt))}
textarea.inp{resize:vertical; font-weight:600; line-height:1.8; background-image:linear-gradient(transparent calc(1.8em - 1px), var(--rule) 0); background-size:100% 1.8em; background-attachment:local; background-position:0 10px}
.wc{font-size:.78rem; color:var(--ink2); text-align:right; margin-top:4px; font-weight:800}
.eq{font-family:var(--f-disp); font-weight:800; font-size:1.08em; white-space:nowrap; background:var(--sun-t); padding:0 .35em; border-radius:6px}
.arahan{margin:0 0 8px; font-weight:800}
.stim{margin-top:12px}
.petikan{border:2.5px solid var(--line); background:var(--soft); padding:16px 20px; border-radius:14px; margin:6px 0 4px; max-width:70ch}
.petikan h4{font-family:var(--f-disp); margin:0 0 8px; font-size:1.15rem; text-align:center; color:var(--c)}
.petikan p{margin:0 0 8px}
.poster{border:3px dashed var(--c); background:var(--paper); border-radius:16px; padding:14px 18px; margin:6px 0 4px; max-width:62ch}
.poster p{margin:4px 0} .poster ul{margin:4px 0 4px 1.2em; padding:0}
.poster-h{font-family:var(--f-disp); font-weight:800; font-size:1.2rem; text-align:center; margin-bottom:6px; color:var(--c)}
.kecil{font-size:.86rem; color:var(--ink2)}
.nota{display:inline-block; border:3px solid var(--line); border-radius:12px; padding:10px 18px; font-weight:800; text-align:center; margin:4px 0; max-width:100%; background:var(--paper); box-shadow:3px 3px 0 var(--sun)}
.nota.msg{font-weight:600; text-align:left; background:var(--sun-t); max-width:56ch; border-radius:4px 18px 18px 18px; box-shadow:none}
.notes{border-left:4px solid var(--c); padding-left:12px; margin-top:8px}
.notes ul{margin:0; padding-left:1.1em}
.match{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap:8px; margin:6px 0}
.match div{border:2px solid var(--rule); border-radius:12px; padding:8px 12px; font-size:.95rem; background:var(--t)}
.match b{font-family:var(--f-disp)}
.grafik{border:3px solid var(--line); border-radius:16px; padding:14px; max-width:560px; background:var(--t)}
.grafik-h{font-family:var(--f-disp); font-weight:800; font-size:1.15rem; text-align:center; margin-bottom:10px}
.grafik-g{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px}
.grafik-g div{display:flex; flex-direction:column; align-items:center; text-align:center; gap:4px; font-size:2.1rem; padding:10px 8px; border:2px solid var(--line); border-radius:12px; background:var(--paper)}
.grafik-g span{font-size:.88rem; font-weight:800}
.rantai{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-weight:900; font-size:1.2rem; margin:8px 0}
.rantai span{border:2.5px solid var(--line); border-radius:12px; padding:5px 14px; font-size:1rem; background:var(--t)}
.siratan, .kitar{font-weight:800; display:grid; gap:4px; border:2.5px solid var(--line); padding:12px 16px; border-radius:14px; background:var(--t); max-width:520px}
.kad4{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; max-width:560px}
.kad4.dua{grid-template-columns:repeat(2, minmax(0,1fr))}
@media (max-width:520px){ .kad4{grid-template-columns:repeat(2, minmax(0,1fr))} }
.kad4 div{border:2.5px solid var(--line); border-radius:12px; padding:10px 8px; text-align:center; background:var(--t); font-size:.94rem}
.tbl{overflow-x:auto; max-width:100%}
table.jd, table.rb{border-collapse:separate; border-spacing:0; margin:6px 0; font-size:.94rem; font-variant-numeric:tabular-nums; border:2.5px solid var(--line); border-radius:12px; overflow:hidden; background:var(--paper)}
table.jd th, table.jd td, table.rb th, table.rb td{border-right:1.5px solid var(--rule); border-bottom:1.5px solid var(--rule); padding:7px 12px; text-align:left; vertical-align:top}
table.jd tr > :last-child, table.rb tr > :last-child{border-right:0}
table.jd tr:last-child > *, table.rb tr:last-child > *{border-bottom:0}
table.jd th, table.rb th{background:var(--t); font-weight:800}
.cap{text-align:center; font-weight:800; font-size:.88rem; margin:2px 0 0; max-width:560px; color:var(--ink2)}
svg.rajah{display:block; width:100%; max-width:380px; height:auto; color:var(--ink); margin:8px 0}
svg.rajah text{fill:currentColor; font-family:var(--f-body); font-weight:800; font-size:13px}
svg.rajah .sh{fill:var(--t); stroke:currentColor; stroke-width:2.5; stroke-linejoin:round}
svg.rajah .sh2{fill:var(--sun-t); stroke:currentColor; stroke-width:2.5; stroke-linejoin:round}
svg.rajah .tk, svg.rajah .ra{stroke:currentColor; stroke-width:1.8; fill:none}
svg.rajah .lbl{font-size:12px}
svg.rajah .gr{stroke:var(--rule); stroke-width:1}
svg.rajah .axl{stroke:currentColor; stroke-width:2}
svg.rajah .ax{font-size:11px; fill:var(--ink2)}
svg.rajah .dot{fill:var(--c)}
svg.rajah .ptl{font-size:12px}
svg.rajah .bar{fill:var(--c); stroke:var(--line); stroke-width:1.5}

/* Hantar, keputusan & skema */
.submit{display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:30px; padding:16px; border-radius:16px; background:var(--t); border:3px solid var(--line)}
.submit p{margin:0; font-weight:800; flex:1 1 220px}
.result{margin-top:28px; border:3px solid var(--line); background:var(--sun-t); border-radius:var(--r); padding:20px; display:grid; grid-template-columns:auto 1fr; gap:16px 24px; align-items:center; box-shadow:6px 6px 0 var(--red); position:relative; overflow:hidden}
.stamp{font-family:var(--f-pen); color:var(--red); font-size:3.4rem; line-height:1; transform:rotate(-7deg); text-align:center; min-width:3.2em; border:4px solid var(--red); border-radius:50%; width:3.4em; height:3.4em; display:grid; place-content:center; background:var(--paper)}
.stamp small{display:block; font-size:1rem}
.result .msg{font-family:var(--f-disp); font-weight:800; font-size:1.5rem; line-height:1.1; margin:0 0 4px}
.result h3{font-family:var(--f-disp); margin:0 0 6px; font-size:1.05rem; color:var(--ink2)}
.result p{margin:3px 0; font-size:.95rem}
.result ul{margin:6px 0 0; padding-left:1.1em; font-size:.92rem}
.result .bigstars{font-size:1.9rem; letter-spacing:4px; line-height:1; color:var(--rule)}
.result .bigstars .on{color:#f5b300}
@media (max-width:520px){ .result{grid-template-columns:1fr; justify-items:start} }
canvas.confetti{position:fixed; inset:0; pointer-events:none; z-index:50; width:100%; height:100%}
.skema{margin-top:34px}
.skema .sec-h h2{background:var(--red-t); color:var(--red); border-color:var(--red)}
.sk{display:grid; grid-template-columns:2.8em 1fr; gap:0 12px; padding-block:12px; border-bottom:2px dashed var(--rule)}
.sk .qn{background:var(--red-t); border-color:var(--red); color:var(--red)}
.sk-body{min-width:0}
.sk-ans{color:var(--red); font-weight:800}
.sk-ans .pen{font-family:var(--f-pen); font-size:1.25rem}
.sk-detail{font-size:.94rem; margin-top:4px}
.sk-you{font-size:.88rem; color:var(--ink2); margin-top:6px; font-weight:700}
.sk-you q{quotes:none; font-style:italic; color:var(--ink)}
.self{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:8px; font-size:.88rem; font-weight:800; background:var(--soft); border-radius:12px; padding:8px 10px}
.self button{min-width:2.4em; padding:4px 8px; border:2.5px solid var(--line); border-radius:10px; background:var(--paper); cursor:pointer; font-family:var(--f-disp); font-weight:800}
.self button[aria-pressed="true"]{background:var(--red); color:var(--on); border-color:var(--red)}
.tag{font-weight:800; font-size:.76rem; padding:2px 9px; border-radius:999px; border:2px solid var(--rule); color:var(--ink2); white-space:nowrap}
.tag.ok{color:var(--ok); border-color:var(--ok); background:var(--ok-t)}

 ]},

  {t:'x', h:`<div class="petikan"><h4>The Hornbill</h4>
<p>The hornbill is a large bird with a long, curved beak. On top of its beak, there is a hard part called a <i>casque</i>. There are ten kinds of hornbills in Malaysia. Sarawak is known as the "Land of the Hornbills".</p>
<p>Hornbills eat mostly fruit, especially figs. When they fly from tree to tree, they drop seeds on the forest floor. These seeds grow into new trees. That is why hornbills are called the "farmers of the forest".</p>
<p>When the mother hornbill lays eggs, she stays inside a hole in a tree. The father closes the hole with mud, leaving only a small gap. He brings food to the mother and babies every day. Today, hornbills are in danger because many forests are cut down.</p></div>`},

  {no:'13(c)', t:'s', s:'<b>Ramalkan</b> suhu air pada minit ke-30.', m:1, tr:['30','30°c','30c'], sk:'30 °C', tp:'KPS: meramal', ar:'S'},
  {no:'13(d)', t:'s', s:'Buat satu <b>inferens</b> mengapa suhu air berhenti menurun pada kira-kira 30 °C.', m:1, sk:'Suhu air telah sama dengan suhu persekitaran (suhu bilik).', tp:'KPS: membuat inferens', ar:'T'},
  {no:'13(e)', t:'s', s:'Nyatakan pemboleh ubah yang <b>dimanipulasikan</b> dan yang <b>bergerak balas</b>.', m:2, sk:'Dimanipulasikan: masa (1m)<br>Bergerak balas: suhu air (1m)', tp:'KPS: mengawal pemboleh ubah', ar:'S'},
  {no:'13(f)', t:'s', s:'Nyatakan <b>satu</b> langkah berjaga-jaga semasa mengendalikan air panas.', m:1, sk:'Memakai sarung tangan tahan haba / memegang bikar dengan penyepit / berhati-hati supaya tidak tertumpah.', tp:'Haba: langkah keselamatan', ar:'R'},
  {t:'x', h:`<p class="arahan"><b>Soalan 14.</b> Rajah 1 menunjukkan siratan makanan di sebuah kawasan sawah.</p><div class="siratan"><div>Padi → Belalang → Katak → Ular → Helang</div><div>Padi → Tikus → Ular</div><div>Tikus → Helang</div></div><p class="cap">Rajah 1</p>`},
  {no:'14(a)', t:'s', s:'Bina satu rantai makanan yang mengandungi <b>empat</b> hidupan daripada siratan makanan itu.', m:2, sk:'Contoh: Padi → Belalang → Katak → Ular / Padi → Tikus → Ular → Helang. (2m jika urutan dan anak panah betul.)', tp:'Haiwan: membina rantai makanan', ar:'S'},
  {no:'14(b)', t:'s', s:'Namakan pengeluar dalam siratan makanan itu.', m:1, tr:['padi'], sk:'Padi', tp:'Haiwan: pengeluar', ar:'R'},
  {no:'14(c)', t:'s', s:'Namakan <b>satu</b> haiwan yang memakan lebih daripada satu jenis haiwan lain.', m:1, tr:['ular','helang'], sk:'Ular (katak, tikus) atau helang (ular, tikus).', tp:'Haiwan: siratan makanan', ar:'S'},
  {no:'14(d)', t:'s', s:'<b>Ramalkan</b> kesan terhadap populasi tikus dan padi jika semua ular ditangkap.', m:2, sk:'Populasi tikus bertambah (1m); populasi padi berkurang kerana lebih banyak dimakan tikus (1m).', tp:'Haiwan: perubahan populasi (KBAT)', ar:'T'},
  {no:'14(e)', t:'s', s:'Terangkan bagaimana tenaga dipindahkan dalam rantai makanan.', m:2, sk:'Tenaga daripada Matahari diserap oleh tumbuhan hijau untuk fotosintesis (1m); tenaga dipindahkan kepada pengguna apabila pengguna memakan pengeluar/pengguna lain (1m).', tp:'Haiwan: pemindahan tenaga', ar:'T'},
  {t:'x', h:`<p class="arahan"><b>Soalan 15.</b> Empat paku besi P, Q, R dan S diletakkan di dalam piring berisi sedikit air dan dibiarkan di luar kelas selama 5 hari.</p><table class="jd"><tr><th>Paku</th><th>Rawatan</th></tr><tr><td>P</td><td>Disapu minyak</td></tr><tr><td>Q</td><td>Dicat</td></tr><tr><td>R</td><td>Tiada rawatan</td></tr><tr><td>S</td><td>Disapu gris</td></tr></table><p class="cap">Jadual 2</p>`},
  {no:'15(a)', t:'o', s:'Paku yang manakah akan berkarat?', p:['P','Q','R','S'], j:2, m:1, tp:'Pengaratan: meramal', ar:'R'},
  {no:'15(b)', t:'s', s:'Apakah tujuan paku R dalam penyiasatan ini?', m:1, sk:'Sebagai kawalan / perbandingan dengan paku yang dirawat.', tp:'KPS: mengeksperimen', ar:'S'},
  {no:'15(c)', t:'s', s:'Nyatakan satu <b>kesimpulan</b> bagi penyiasatan ini.', m:2, sk:'Menyapu minyak, gris atau cat dapat mencegah paku besi daripada berkarat. (2m)', tp:'KPS: membuat kesimpulan', ar:'T'},
  {no:'15(d)', t:'s', s:'Terangkan bagaimana cat dapat mencegah pengaratan.', m:2, sk:'Cat menjadi lapisan pelindung (1m) yang menghalang besi daripada terdedah kepada air dan udara (1m).', tp:'Pengaratan: cara mencegah', ar:'S'},
  {no:'15(e)', t:'s', s:'Mengapakah penting untuk mencegah pengaratan pada jambatan besi? Berikan <b>dua</b> sebab.', m:2, sk:'Jambatan lebih tahan lama (1m); mengelakkan jambatan rapuh dan runtuh — keselamatan pengguna (1m); menjimatkan kos baik pulih.', tp:'Pengaratan: kepentingan mencegah (KBAT)', ar:'T'},
  {t:'x', h:`<p class="arahan"><b>Soalan 16.</b> Jadual 3 menunjukkan penggunaan penghawa dingin di rumah Amir dan jumlah bil elektrik bagi dua bulan.</p><table class="jd"><tr><th>Bulan</th><th>Penggunaan penghawa dingin sehari</th><th>Bil elektrik</th></tr><tr><td>Jun</td><td>4 jam</td><td>RM180</td></tr><tr><td>Julai</td><td>8 jam</td><td>RM240</td></tr></table><p class="cap">Jadual 3</p>`},
  {no:'16(a)', t:'s', s:'Nyatakan <b>satu</b> faktor yang mempengaruhi penggunaan tenaga elektrik.', m:1, sk:'Tempoh masa alat digunakan / bilangan alat / kuasa alat elektrik.', tp:'Elektrik: faktor penggunaan', ar:'R'},
  {no:'16(b)', t:'s', s:'Mengapakah bil elektrik bulan Julai lebih tinggi daripada bulan Jun?', m:2, sk:'Penghawa dingin digunakan lebih lama pada bulan Julai (1m), jadi lebih banyak tenaga elektrik digunakan (1m).', tp:'KPS: mentafsir data', ar:'S'},
  {no:'16(c)', t:'s', s:'Cadangkan <b>dua</b> cara untuk menjimatkan penggunaan elektrik di rumah.', m:2, sk:'Mematikan suis apabila tidak digunakan; menggunakan lampu jimat tenaga/LED; menetapkan suhu penghawa dingin pada 24–25 °C; menggunakan kipas berbanding penghawa dingin.', tp:'Elektrik: penjimatan tenaga', ar:'S'},
  {no:'16(d)', t:'s', s:'Nyatakan <b>satu</b> kesan salah mengendalikan alat elektrik.', m:1, sk:'Renjatan elektrik / kebakaran / litar pintas.', tp:'Elektrik: kesan salah guna', ar:'R'},
  {no:'16(e)', t:'w', rows:3, s:'Cadangkan <b>satu</b> idea inovasi untuk mengurangkan pembaziran elektrik di sekolah. Terangkan cara idea itu berfungsi.', m:2, sk:'Idea munasabah (1m) + penerangan cara berfungsi (1m). Contoh: lampu dengan pengesan gerakan yang menyala hanya apabila ada orang di dalam kelas.', tp:'Elektrik: menjana idea (KBAT)', ar:'T'},
 ]},
 ]
},
];

})();
</script>
<script>
(function(){
'use strict';
const $ = (s, r=document) => r.querySelector(s);
const app = $('#app');
const ABC = 'ABCDEFGH';
const MASA = 75*60;
const store = {
 get(k){ try{ return JSON.parse(localStorage.getItem('skoruasa:'+k)); }catch(e){ return null; } },
 set(k,v){ try{ localStorage.setItem('skoruasa:'+k, JSON.stringify(v)); }catch(e){} },
 del(k){ try{ localStorage.removeItem('skoruasa:'+k); }catch(e){} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s||'').toLowerCase().replace(/\s+/g,'').replace(/^rm/,'').replace(/\.$/,'').replace(/[–—]/g,'-');
const gred = p => p>=82?['A','Cemerlang']:p>=66?['B','Kepujian']:p>=50?['C','Baik']:p>=35?['D','Memuaskan']:p>=20?['E','Mencapai Tahap Minimum']:['F','Belum Mencapai Tahap Minimum'];
const kira = s => s.trim() ? s.trim().split(/\s+/).length : 0;
const SW = 'fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"';
const ICON = {
 bm:`<svg viewBox="0 0 32 32" ${SW}><path d="M4 7c4-1.5 8-1.5 12 1v18c-4-2.5-8-2.5-12-1z"/><path d="M28 7c-4-1.5-8-1.5-12 1v18c4-2.5 8-2.5 12-1z"/><path d="M8 12h4M8 16h4M20 12h4M20 16h4"/></svg>`,
 bi:`<svg viewBox="0 0 32 32" ${SW}><path d="M5 6h22v15H14l-6 5v-5H5z"/><path d="M10 17l2.5-7 2.5 7M11 15h3M18 10v7M18 10h2.2a1.7 1.7 0 010 3.4H18M18 13.4h2.6a1.8 1.8 0 010 3.6H18"/></svg>`,
 mt:`<svg viewBox="0 0 32 32" ${SW}><rect x="5" y="4" width="22" height="24" rx="4"/><path d="M10 10h12M10 16h3M11.5 14.5v3M19 16h3M10 21.5l3 3M13 21.5l-3 3M19 22h3M19 25h3"/></svg>`,
 sn:`<svg viewBox="0 0 32 32" ${SW}><path d="M12 4h8M13 4v8l-7 12a3 3 0 002.6 4.5h14.8A3 3 0 0026 24l-7-12V4"/><path d="M9 20h14"/><circle cx="14" cy="24" r="1.2" fill="currentColor"/><circle cx="18.5" cy="22.5" r="1" fill="currentColor"/></svg>`
};
const bintang = g => ({A:3,B:2,C:2,D:1,E:1}[g]||0);
const starHtml = n => [0,1,2].map(i=>`<span class="${i<n?'on':''}">★</span>`).join('');
const HERO_ART = `<svg class="hero-art" viewBox="0 0 160 150" aria-hidden="true">
 <rect x="22" y="18" width="100" height="124" rx="10" fill="var(--paper)" stroke="var(--line)" stroke-width="4" transform="rotate(-6 72 80)"/>
 <g transform="rotate(-6 72 80)" stroke="var(--rule)" stroke-width="4" stroke-linecap="round"><path d="M40 52h62M40 70h62M40 88h48M40 106h56"/></g>
 <g transform="rotate(-6 72 80)"><circle cx="34" cy="52" r="5" fill="var(--bm)"/><circle cx="34" cy="70" r="5" fill="var(--bi)"/><circle cx="34" cy="88" r="5" fill="var(--mt)"/><circle cx="34" cy="106" r="5" fill="var(--sn)"/></g>
 <text x="104" y="54" font-family="Kalam, cursive" font-size="38" font-weight="700" fill="var(--red)" transform="rotate(-12 104 54)">A</text>
 <g transform="rotate(38 118 104)"><rect x="104" y="56" width="18" height="70" rx="3" fill="var(--sun)" stroke="var(--line)" stroke-width="4"/><path d="M104 126l9 18 9-18z" fill="var(--paper)" stroke="var(--line)" stroke-width="4" stroke-linejoin="round"/><path d="M110 138l3 6 3-6z" fill="var(--line)"/></g>
</svg>`;
const MSG = {A:'Hebat! Kamu bintang kelas! 🌟', B:'Bagus sekali! Sikit lagi ke A!', C:'Baik! Teruskan berusaha.', D:'Boleh lagi! Ulang kaji topik di bawah.', E:'Jangan putus asa — kamu pasti boleh!', F:'Mari cuba lagi, satu topik demi satu topik.'};

// Nombor soalan & senarai item bermarkah bagi satu set
function items(set){
 const out=[]; let n=0;
 set.bhg.forEach((b,bi)=> b.q.forEach((q,qi)=>{ if(q.t==='x') return;
  let lbl; if(q.no){ lbl=q.no; n=parseInt(q.no,10); } else { n++; lbl=String(n); }
  out.push({q, lbl, id:bi+'-'+qi, bi});
 }));
 return out;
}

/* ---------- Laman utama ---------- */
function home(){
 setNav('utama'); timerHide();
 const M = META;
 let h = `<section class="hero"><div><h1>Jom sedia untuk <mark>UASA Tahun 5!</mark></h1>
 <p>Pilih subjek dan set, jawab terus di skrin, dan lihat markah kamu serta-merta. Setiap kertas ikut <b>format rasmi UASA KPM</b>, dengan skema jawapan di hujung set.</p>
 <div class="facts"><span>4 subjek</span><span>12 kertas</span><span>50 markah</span><span>1 jam 15 minit</span></div></div>${HERO_ART}</section><div class="grid">`;
 M.urutan.forEach(k=>{
  const mp=M.mp[k];
  const nb = SETS[k].reduce((a,s)=>{ const b=store.get(`best:${k}:${s.set}`); return a+(b?bintang(b.g):0); },0);
  h += `<article class="mp" style="--c:var(--${k});--t:var(--${k}-t)"><div class="mp-h"><span class="ico">${ICON[k]}</span><div><h2>${mp.nama}</h2><small>${nb} / 9 bintang dikumpul</small></div></div>
  <div class="mp-b"><p class="fmt">${M.format[k].map(r=>r[0]).join(' · ')}</p><div class="sets">`;
  SETS[k].forEach(s=>{
   const best = store.get(`best:${k}:${s.set}`);
   h += `<a class="set-btn ${best?'done':''}" href="#${k}-${s.set}"><b>Set ${s.set}</b><span class="st" aria-hidden="true">${starHtml(best?bintang(best.g):0)}</span><span class="sc">${best? best.m+'/50 · Gred '+best.g : 'Belum cuba'}</span></a>`;
  });
  h += `</div></div></article>`;
 });
 h += `</div><p class="note"><b>Tentang ramalan ini.</b> Soalan UASA sebenar disediakan oleh setiap sekolah mengikut format KPM, jadi tiada sesiapa dapat menjamin soalan yang sama akan keluar. Set ini dibina untuk memadankan format, pemberat markah dan topik teras DSKP Tahun 5 sepenuhnya. Lihat <a href="#analisis">Analisis</a> untuk topik yang paling wajar diberi tumpuan.</p>`;
 app.innerHTML = h;
}

/* ---------- Kertas soalan ---------- */
let cur = null; // {k, set, st}
function paper(k, n){
 const set = SETS[k] && SETS[k].find(s=>s.set===n);
 if(!set) return home();
 setNav('');
 const mp = META.mp[k];
 const key = `ans:${k}:${n}`;
 const st = store.get(key) || {a:{}, self:{}, done:false, sk:false, t:MASA};
 cur = {k, n, set, st, key, mp, its: items(set)};
 const fmt = META.format[k];
 $('#progbar').style.setProperty('--c', `var(--${k})`);
 let h = `<article class="paper" style="--c:var(--${k});--t:var(--${k}-t)">
 <div class="cover"><span class="ico">${ICON[k]}</span><div><div class="lbl">UASA Tahun 5 · Kertas Ramalan</div><h1>${mp.nama}</h1></div>
 <div class="meta"><span class="setno">Set ${n}</span></div>
 <div class="bar"><span>⏱ 1 jam 15 minit</span><span>50 markah</span><span>${fmt.length} bahagian · jawab semua</span></div></div>
 <div class="tools"><a class="btn" href="#utama">← Semua kertas</a><button class="btn" id="b-timer">⏱ Mula pemasa</button><button class="btn red" id="b-skema">Buka skema</button><button class="btn" id="b-reset">Padam jawapan</button></div>
 <div id="conf"></div>`;
 set.bhg.forEach((b,bi)=>{
  h += `<section class="sec"><div class="sec-h"><h2>${b.n}</h2><span class="m">[${b.m} markah]</span></div><p class="sec-a">${b.a}</p>`;
  b.q.forEach((q,qi)=>{
   if(q.t==='x'){ h += `<div class="stim">${q.h}</div>`; return; }
   const it = cur.its.find(x=>x.id===bi+'-'+qi);
   h += qHtml(it, st);
  });
  h += `</section>`;
 });
 h += `<div class="submit"><p id="prog"></p><button class="btn pri" id="b-hantar">Hantar &amp; semak ✓</button></div>
 <div id="hasil"></div><div id="skema"></div></article>`;
 app.innerHTML = h;
 bindPaper();
 progress();
 if(st.done || st.sk) renderSkema();
 timerShow();
 window.scrollTo(0,0);
}

function qHtml(it, st){
 const q=it.q, v=st.a[it.id];
 let body='';
 if(q.t==='o'){
  const c8 = q.p.length===8 && q.p.every(x=>x.length===1);
  const c2 = !c8 && q.p.every(x=>x.length<22);
  body = `<div class="opts ${c8?'c8':c2?'c2':''}" role="group" aria-label="Pilihan jawapan soalan ${esc(it.lbl)}">` + q.p.map((p,i)=>
   `<button type="button" class="opt" data-q="${it.id}" data-i="${i}" aria-pressed="${v===i}"><span class="bub">${ABC[i]}</span>${c8?'':`<span>${p}</span>`}</button>`).join('') + `</div>`;
 } else if(q.t==='s'){
  body = `<input class="inp" id="i-${it.id}" data-q="${it.id}" autocomplete="off" placeholder="Tulis jawapan" value="${esc(v||'')}">`;
 } else {
  body = `<textarea class="inp" id="i-${it.id}" data-q="${it.id}" rows="${q.rows||6}" placeholder="Tulis jawapan di sini">${esc(v||'')}</textarea><div class="wc" id="wc-${it.id}">${kira(v||'')} patah perkataan</div>`;
 }
 const dij = v!==undefined && v!==null && v!=='';
 return `<div class="q${dij?' answered':''}" id="q-${it.id}"><div class="qn${it.lbl.length>2?' long':''}">${esc(it.lbl)}</div><div class="qb"><span class="qm">[${q.m} markah]</span><p class="qs">${q.s}</p>${body}</div></div>`;
}

function save(){ store.set(cur.key, cur.st); }
function progress(){
 const tot = cur.its.length;
 const ans = cur.its.filter(it=>{ const v=cur.st.a[it.id]; return v!==undefined && v!==null && v!==''; }).length;
 const el=$('#prog'); if(el) el.textContent = ans===tot ? `Semua ${tot} soalan sudah dijawab. Hebat!` : `${ans} daripada ${tot} soalan telah dijawab.`;
 const pp=$('#prog-pill'); pp.hidden=false; pp.textContent=`✏️ ${ans}/${tot}`;
 const pb=$('#progbar'); pb.hidden=false; pb.firstElementChild.style.width=(ans/tot*100)+'%';
 cur.its.forEach(it=>{ const v=cur.st.a[it.id]; const q=$('#q-'+it.id); if(q) q.classList.toggle('answered', v!==undefined && v!==null && v!==''); });
}

function bindPaper(){
 app.addEventListener('click', onClick);
 app.addEventListener('input', onInput);
}
function onClick(e){
 if(!cur) return;
 const o = e.target.closest('.opt');
 if(o && !cur.st.done){
  const id=o.dataset.q, i=+o.dataset.i;
  cur.st.a[id]=i; save();
  o.parentElement.querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed', b===o));
  progress(); return;
 }
 const sb = e.target.closest('[data-self]');
 if(sb){ const id=sb.dataset.self; cur.st.self[id]=+sb.dataset.v; save(); renderSkema(); return; }
 const t = e.target.closest('button'); if(!t) return;
 if(t.id==='b-hantar'){ submit(); }
 else if(t.id==='b-skema'){
  if(cur.st.done || cur.st.sk){ $('#skema').scrollIntoView({behavior:'smooth'}); return; }
  $('#conf').innerHTML = `<div class="confirm">Buka skema sebelum menjawab? Skema akan dipaparkan di hujung kertas. <button class="btn red" id="c-skema">Ya, buka</button><button class="btn" id="c-batal">Batal</button></div>`;
 }
 else if(t.id==='c-skema'){ cur.st.sk=true; save(); $('#conf').innerHTML=''; renderSkema(); $('#skema').scrollIntoView({behavior:'smooth'}); }
 else if(t.id==='c-batal' || t.id==='r-batal'){ $('#conf').innerHTML=''; }
 else if(t.id==='b-reset'){
  $('#conf').innerHTML = `<div class="confirm">Padam semua jawapan dan markah bagi set ini? <button class="btn red" id="r-ya">Ya, padam</button><button class="btn" id="r-batal">Batal</button></div>`;
 }
 else if(t.id==='r-ya'){ store.del(cur.key); timerStop(); const k=cur.k,n=cur.n; cur=null; app.removeEventListener('click', onClick); app.removeEventListener('input', onInput); paper(k,n); }
 else if(t.id==='b-timer'){ timerToggle(); }
}
function onInput(e){
 if(!cur || cur.st.done) return;
 const el=e.target; if(!el.dataset || !el.dataset.q) return;
 cur.st.a[el.dataset.q]=el.value; save();
 const wc=$('#wc-'+el.dataset.q); if(wc) wc.textContent = kira(el.value)+' patah perkataan';
 progress();
}

function autoMark(it){
 const q=it.q, v=cur.st.a[it.id];
 if(q.t==='o') return v===q.j ? q.m : 0;
 if(q.t==='s' && q.tr && v){ const nv=norm(v); if(q.tr.some(t=>norm(t)===nv)) return q.m; }
 return null; // perlu tanda sendiri
}
function score(){
 let auto=0, self=0, pending=0, max=0; const salah=[];
 const ar={R:[0,0],S:[0,0],T:[0,0]};
 cur.its.forEach(it=>{
  const q=it.q; max+=q.m;
  let m = autoMark(it);
  if(m===null){ if(cur.st.self[it.id]!==undefined){ m=cur.st.self[it.id]; self+=m; } else { pending++; m=0; } }
  else auto+=m;
  ar[q.ar][0]+=m; ar[q.ar][1]+=q.m;
  if(m<q.m) salah.push(q.tp);
 });
 return {auto, self, pending, max, total:auto+self, ar, salah};
}

function submit(){
 cur.st.done=true; save(); timerStop();
 app.querySelectorAll('.inp').forEach(el=>el.readOnly=true);
 // tanda pilihan objektif
 cur.its.forEach(it=>{ if(it.q.t!=='o') return;
  app.querySelectorAll(`.opt[data-q="${it.id}"]`).forEach(b=>{ const i=+b.dataset.i;
   if(i===it.q.j) b.classList.add('ok'); else if(i===cur.st.a[it.id]) b.classList.add('no'); });
 });
 renderSkema();
 $('#hasil').scrollIntoView({behavior:'smooth'});
}

function renderResult(){
 const s=score(), pct=Math.round(s.total/s.max*100), g=gred(pct);
 if(cur.st.done){
  const prev=store.get(`best:${cur.k}:${cur.n}`);
  if(s.pending===0 && (!prev || s.total>=prev.m)) store.set(`best:${cur.k}:${cur.n}`, {m:s.total, g:g[0]});
 }
 const topik=[...new Set(s.salah)].slice(0,8);
 if(cur.st.done && s.pending===0 && pct>=66 && !cur.yay){ cur.yay=true; confetti(); }
 const arl = k=>`${s.ar[k][0]}/${s.ar[k][1]}`;
 $('#hasil').innerHTML = `<div class="result"><div class="stamp">${s.total}<small>/ ${s.max}</small></div><div>
 <div class="bigstars" aria-label="${bintang(g[0])} bintang">${starHtml(bintang(g[0]))}</div>
 <p class="msg">${MSG[g[0]]}</p>
 <h3>Gred ${g[0]} · ${g[1]} (${pct}%)</h3>
 <p>Ditanda automatik: <b>${s.auto}</b> markah · Tanda sendiri: <b>${s.self}</b> markah${s.pending?` · <b>${s.pending}</b> soalan belum ditanda — semak skema di bawah dan pilih markah.`:''}</p>
 <p>Aras rendah ${arl('R')} · sederhana ${arl('S')} · tinggi ${arl('T')}</p>
 ${topik.length?`<p><b>Topik untuk diulang kaji:</b></p><ul>${topik.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}
 <p class="kecil">Gred ikut julat UASA: A 82–100, B 66–81, C 50–65, D 35–49, E 20–34, F 0–19.</p></div></div>`;
}

function confetti(){
 if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
 const c=document.createElement('canvas'); c.className='confetti'; document.body.appendChild(c);
 let x=null; try{ x=c.getContext('2d'); }catch(e){} if(!x){ c.remove(); return; }
 const W=c.width=innerWidth, H=c.height=innerHeight;
 const cs=getComputedStyle(document.documentElement), col=['--bm','--bi','--mt','--sn','--sun','--red'].map(v=>cs.getPropertyValue(v).trim()||'#ffd23f');
 const P=Array.from({length:140},()=>({x:Math.random()*W, y:-20-Math.random()*H*.5, vx:(Math.random()-.5)*3, vy:2+Math.random()*3.5, r:Math.random()*6.28, vr:(Math.random()-.5)*.3, w:6+Math.random()*6, h:8+Math.random()*8, c:col[Math.floor(Math.random()*col.length)]}));
 let f=0; (function step(){ x.clearRect(0,0,W,H); P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.03; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore(); });
  if(++f<220) requestAnimationFrame(step); else c.remove(); })();
}

function renderSkema(){
 const done=cur.st.done;
 if(done) renderResult();
 let h = `<section class="skema" id="skema-sec"><div class="sec-h"><h2>Skema Jawapan · Set ${cur.n}</h2><span class="m">${cur.mp.nama}</span></div>`;
 if(!done) h += `<p class="sec-a">Skema dibuka sebelum menjawab. Jawab kertas dan tekan "Hantar &amp; semak" untuk mendapat markah.</p>`;
 let lastB=-1;
 cur.its.forEach(it=>{
  const q=it.q;
  if(it.bi!==lastB){ lastB=it.bi; h+=`<p class="sec-a" style="font-style:normal;font-weight:700">${cur.set.bhg[it.bi].n}</p>`; }
  let ans='';
  if(q.t==='o') ans = `<span class="pen">${ABC[q.j]}</span> · ${q.p[q.j].length>1?q.p[q.j]:''}`;
  else if(q.t==='s') ans = q.sk;
  const detail = q.t==='w' ? q.sk : (q.t==='s' ? '' : '');
  let you='', tag='', self='';
  if(done){
   const v=cur.st.a[it.id], am=autoMark(it);
   if(q.t==='o') you = v===undefined ? 'Tidak dijawab' : `Jawapan anda: ${ABC[v]}`;
   else if(q.t==='s') you = v ? `Jawapan anda: <q>${esc(v)}</q>` : 'Tidak dijawab';
   else you = v ? `Jawapan anda: ${kira(v)} patah perkataan` : 'Tidak dijawab';
   if(am!==null) tag = `<span class="tag ${am===q.m?'ok':'no'}">${am}/${q.m} · auto</span>`;
   else {
    const sv=cur.st.self[it.id];
    tag = `<span class="tag ${sv===undefined?'':(sv===q.m?'ok':'no')}">${sv===undefined?'?':sv}/${q.m}</span>`;
    self = `<div class="self"><span>Bandingkan dengan skema, kemudian beri markah:</span>${Array.from({length:q.m+1},(_,m)=>`<button type="button" data-self="${it.id}" data-v="${m}" aria-pressed="${sv===m}">${m}</button>`).join('')}</div>`;
   }
  }
  h += `<div class="sk"><div class="qn">${esc(it.lbl)}</div><div class="sk-body">
   <div style="display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap"><div class="sk-ans">${ans}</div>${tag||`<span class="tag">${q.m} markah</span>`}</div>
   ${detail?`<div class="sk-detail tbl">${detail}</div>`:''}
   <div class="sk-you">${you} <span class="kecil">· ${esc(q.tp)}</span></div>${self}</div></div>`;
 });
 h += `</section>`;
 $('#skema').innerHTML = h;
}

/* ---------- Pemasa ---------- */
let tick=null;
const fmtT = t => { const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60; return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':'); };
function timerShow(){ const b=$('#timer'); b.hidden=false; b.textContent='⏱ '+fmtT(cur.st.t??MASA); b.classList.toggle('low', (cur.st.t??MASA)<600); }
function timerHide(){ timerStop(); $('#timer').hidden=true; $('#prog-pill').hidden=true; $('#progbar').hidden=true; }
function timerStop(){ if(tick){ clearInterval(tick); tick=null; } const b=$('#b-timer'); if(b) b.textContent='⏱ Mula pemasa'; }
function timerToggle(){
 if(!cur || cur.st.done) return;
 if(tick){ timerStop(); return; }
 const b=$('#b-timer'); if(b) b.textContent='⏸ Jeda pemasa';
 tick=setInterval(()=>{ cur.st.t=Math.max(0,(cur.st.t??MASA)-1); timerShow(); if(cur.st.t%10===0) save();
  if(cur.st.t===0){ timerStop(); save(); $('#conf').innerHTML=`<div class="confirm"><b>Masa tamat.</b> Tekan "Hantar &amp; semak jawapan" untuk melihat markah.</div>`; } },1000);
}
$('#timer').addEventListener('click', ()=>timerToggle());

/* ---------- Analisis ---------- */
function analisis(k){
 setNav('analisis'); timerHide();
 k = k || 'bm';
 const M=META, mp=M.mp[k];
 // taburan markah ikut topik utama dalam 3 set
 const dist={};
 SETS[k].forEach(s=>items(s).forEach(it=>{ const t=it.q.tp.split(':')[0].replace(/\s*\(.*\)/,'').trim(); dist[t]=(dist[t]||0)+it.q.m; }));
 const rows=Object.entries(dist).sort((a,b)=>b[1]-a[1]); const mx=rows[0][1];
 let h = `<section class="an paper" style="--c:var(--${k});--t:var(--${k}-t)"><h2>Analisis Ramalan UASA Tahun 5</h2>
 <p class="kecil">Asas analisis: Format Instrumen Pentaksiran UASA Tahap Dua Sekolah Rendah (KPM, 2025), DSKP KSSR Semakan Tahun 5, dan corak kertas model UASA terbitan 2024–2025.</p>
 <div class="tabs" role="tablist">${M.urutan.map(x=>`<button role="tab" style="--tc:var(--${x})" aria-selected="${x===k}" data-an="${x}">${M.mp[x].nama}</button>`).join('')}</div>
 <h3>Format rasmi · 50 markah · 1 jam 15 minit</h3><div class="tbl"><table class="jd"><tr><th>Bahagian</th><th>Kandungan</th><th>Markah</th></tr>${M.format[k].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table></div>
 <h3>Fokus ramalan</h3>
 <p class="kecil"><span class="pill wajib">PASTI</span> ditetapkan oleh format rasmi · <span class="pill tinggi">TINGGI</span> standard teras DSKP yang sesuai dengan format · <span class="pill sederhana">SEDERHANA</span> mungkin muncul 1 soalan</p>
 <div class="rlist">${M.ramalan[k].map(r=>`<div class="ritem"><div><span class="pill ${r[0]}">${r[0]==='wajib'?'PASTI':r[0].toUpperCase()}</span></div><div><h4>${r[1]}</h4><p>${r[2]}</p></div></div>`).join('')}</div>
 <h3>Taburan markah mengikut bidang dalam 3 set ini</h3><p class="kecil">Jumlah 150 markah (3 × 50).</p>
 <div class="dist">${rows.map(([t,v])=>`<div class="drow"><span class="lb" title="${esc(t)}">${esc(t)}</span><div class="tr"><div class="fl" style="width:${(v/mx*100).toFixed(1)}%"></div></div><span class="v">${v}</span></div>`).join('')}</div>
 <p class="note" style="margin-bottom:0">Soalan UASA disediakan oleh panitia setiap sekolah berpandukan format di atas. Bahagian yang ditanda <b>PASTI</b> akan muncul kerana ditetapkan oleh format; topik khusus dalam bahagian lain berbeza antara sekolah. Gunakan set ini untuk menguasai format dan topik teras, bukan menghafal jawapan.</p>
 </section>`;
 app.innerHTML = h;
 app.querySelectorAll('[data-an]').forEach(b=>b.addEventListener('click', ()=>analisis(b.dataset.an)));
}

/* ---------- Penghala ---------- */
function setNav(p){ ['utama','analisis'].forEach(x=>{ const a=$('#nav-'+x); if(p===x) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); }); }
function route(){
 if(cur){ app.removeEventListener('click', onClick); app.removeEventListener('input', onInput); timerStop(); cur=null; }
 const h=(location.hash||'').slice(1);
 const m=h.match(/^(bm|bi|mt|sn)-([123])$/);
 if(m) return paper(m[1], +m[2]);
 const a=h.match(/^analisis(?:-(bm|bi|mt|sn))?$/);
 if(a) return analisis(a[1]);
 home();
}
window.addEventListener('hashchange', route);
route();
})();
</script>
